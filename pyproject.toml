[project]
name = "taskmaster"
version = "26.07.23.41"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "dst@iki.fi" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.161.1",
    "google-api-python-client>=2.201.0",
    "google-auth-httplib2>=0.4.4",
    "google-auth-oauthlib>=1.5.0",
    "instructor>=1.17.0",
    "litellm>=1.106.2",
    "pydantic>=2.14.1",
    "pytest>=9.1.1",
    "pytest-mock>=3.17.0",
    "python-dotenv>=1.2.4",
    "rich>=14.3.4",
    "ruff>=0.17.2",
    "streamlit>=1.58.0",
    "textual>=8.2.8",
    "todoist-api-python>=4.0.0",
    "uvicorn>=0.54.0",
    "zeroconf>=0.151.5",
]

[project.scripts]
taskmaster = "main:app"
taskmaster-cli = "cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/main.py", "src/api", "src/services", "src/models"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m \"not slow\""
markers = [
    "slow: tests that hit real llama-server (may take 60s+)",
]

[dependency-groups]
dev = [
    "playwright>=1.64.1",
]
